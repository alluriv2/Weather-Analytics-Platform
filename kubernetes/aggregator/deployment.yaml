apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-aggregator
  namespace: weather-dev
  labels:
    app.kubernetes.io/name: weather-aggregator
    app.kubernetes.io/component: aggregator
    app.kubernetes.io/part-of: weather-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: weather-aggregator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weather-aggregator
        app.kubernetes.io/component: aggregator
        app.kubernetes.io/part-of: weather-platform
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: aggregator
          image: weather-platform:0.5.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          command:
            - python
            - weather_aggregation_postgres.py
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - configMapRef:
                name: weather-config
            - secretRef:
                name: postgres-credentials
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
