apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: weather-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: weather-api
        metrics_path: /metrics
        static_configs:
          - targets: ["weather-api:8000"]

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics:8080"]

      - job_name: kubernetes-kubelet
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

      - job_name: kubernetes-cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: weather-platform
data:
  weather-platform.yml: |
    groups:
      - name: weather-platform
        rules:
          - alert: WeatherApiDown
            expr: up{job="weather-api"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Weather API is unavailable

          - alert: WeatherDatabaseDown
            expr: weather_database_up == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Weather API cannot reach PostgreSQL

          - alert: WeatherIngestionNeedsBackfill
            expr: weather_ingestion_requires_backfill == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Station {{ $labels.station }} requires reconciliation

          - alert: WeatherProducerConsumerGap
            expr: weather_ingestion_gap_seconds{stage="producer_consumer"} > 120
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Station {{ $labels.station }} consumer is behind

          - alert: WeatherApiHighErrorRate
            expr: |
              (
                sum(rate(weather_api_http_requests_total{status=~"5.."}[5m]))
                /
                clamp_min(sum(rate(weather_api_http_requests_total[5m])), 0.001)
              ) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Weather API error rate exceeds five percent

      - name: kubernetes
        rules:
          - alert: KubernetesDeploymentUnavailable
            expr: kube_deployment_status_replicas_unavailable{namespace="weather-python"} > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Deployment {{ $labels.deployment }} has unavailable replicas

          - alert: KubernetesPodCrashLooping
            expr: increase(kube_pod_container_status_restarts_total{namespace="weather-python"}[10m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Pod {{ $labels.pod }} is repeatedly restarting
