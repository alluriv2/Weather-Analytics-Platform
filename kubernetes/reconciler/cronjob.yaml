apiVersion: batch/v1
kind: CronJob
metadata:
  name: weather-reconciler
  labels:
    app.kubernetes.io/name: weather-reconciler
    app.kubernetes.io/component: data-reconciliation
    app.kubernetes.io/part-of: weather-platform
spec:
  schedule: "*/5 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: weather-reconciler
            app.kubernetes.io/component: data-reconciliation
            app.kubernetes.io/part-of: weather-platform
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: reconciler
              image: weather-platform:0.5.3
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              command:
                - python
                - inital_backfill.py
              envFrom:
                - configMapRef:
                    name: weather-config
                - secretRef:
                    name: postgres-credentials
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 750m
                  memory: 768Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
